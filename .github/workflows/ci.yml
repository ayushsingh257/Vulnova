name: Vulnova Monorepo CI Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  repository-integrity:
    name: Verify Repository Structure & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Core Documentation Artifacts
        run: |
          echo "Verifying baseline documentation files..."
          test -f README.md
          test -f BRAIN.md
          test -f ROADMAP.md
          test -f PROJECT_STRUCTURE.md
          test -f ARCHITECTURE.md
          test -f SECURITY.md
          test -f DATABASE.md
          test -f API_SPEC.md
          test -f FRONTEND_GUIDELINES.md
          test -f BACKEND_GUIDELINES.md
          test -f TESTING.md
          test -f DEVSECOPS.md
          test -f DEPLOYMENT.md
          test -f STYLE_GUIDE.md
          test -f DECISIONS.md
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          echo "All 19 baseline documentation artifacts present."

  backend-checks:
    name: Backend Python Lint & Test Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest httpx pydantic pydantic-settings fastapi uvicorn

      - name: Run Ruff Linter
        run: ruff check backend/app

      - name: Run Mypy Type Checker
        run: mypy backend/app --ignore-missing-imports

      - name: Run Pytest Suite
        run: pytest backend/tests

  frontend-checks:
    name: Frontend Next.js Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Verify TypeScript & Build
        working-directory: frontend
        run: npm run type-check
