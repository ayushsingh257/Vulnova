name: vulnova

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vulnova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vulnova_db}
      POSTGRES_USER: ${POSTGRES_USER:-vulnova_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vulnova_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vulnova_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vulnova_admin} -d ${POSTGRES_DB:-vulnova_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: vulnova-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vulnova_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vulnova-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://vulnova_admin:vulnova_secure_password@postgres:5432/vulnova_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-vulnova_dev_jwt_secret_key_32_characters_minimum}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    networks:
      - vulnova_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vulnova-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000/api/v1}
    networks:
      - vulnova_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: vulnova-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - vulnova_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.3.0
    container_name: vulnova-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=vulnova_secure_grafana_password
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deployment/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./deployment/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    networks:
      - vulnova_net
    depends_on:
      prometheus:
        condition: service_healthy

networks:
  vulnova_net:
    driver: bridge
    name: vulnova_net

volumes:
  postgres_data:
    name: vulnova_postgres_data
  redis_data:
    name: vulnova_redis_data
  prometheus_data:
    name: vulnova_prometheus_data
  grafana_data:
    name: vulnova_grafana_data

