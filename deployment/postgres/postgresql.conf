# Vulnova Enterprise PostgreSQL Production & PITR WAL Archiving Configuration

# --- Write-Ahead Logging (WAL) & PITR Settings ---
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 60 # Force WAL segment switch every 60 seconds

# --- Performance & Memory Tuning (Era 11) ---
max_connections = 100
shared_buffers = 256MB
effective_cache_size = 768MB
maintenance_work_mem = 64MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 6400kB
huge_pages = off
min_wal_size = 1GB
max_wal_size = 4GB

# --- Logging & Slow Query Settings ---
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_duration_statement = 100 # Log queries exceeding 100ms
log_line_prefix = '%m [%p] %q%u@%d '
