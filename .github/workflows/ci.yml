name: Vulnova Monorepo CI Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  repository-integrity:
    name: Verify Repository Structure & Document Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Baseline Specification Documents
        run: |
          echo "Verifying baseline documentation files..."
          test -f README.md
          test -f BRAIN.md
          test -f ROADMAP.md
          test -f PROJECT_STRUCTURE.md
          test -f ARCHITECTURE.md
          test -f SECURITY.md
          test -f DATABASE.md
          test -f API_SPEC.md
          test -f FRONTEND_GUIDELINES.md
          test -f BACKEND_GUIDELINES.md
          test -f TESTING.md
          test -f DEVSECOPS.md
          test -f DEPLOYMENT.md
          test -f STYLE_GUIDE.md
          test -f DECISIONS.md
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f DEVELOPMENT.md
          echo "All baseline documentation artifacts present."

  docker-validation:
    name: Docker Infrastructure Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Syntax
        run: docker compose config

  backend-checks:
    name: Backend Lint, Black, Mypy & Pytest Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies from Authoritative requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Black Formatter Check
        run: black --check backend/app

      - name: Run Ruff Linter
        run: ruff check backend/app

      - name: Run Mypy Type Checker
        run: mypy backend/app --ignore-missing-imports

      - name: Run Pytest Suite
        working-directory: backend
        run: pytest

  frontend-checks:
    name: Frontend Lint, Type-Check & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Verify TypeScript Types
        working-directory: frontend
        run: npm run type-check

      - name: Build Next.js Application
        working-directory: frontend
        run: npm run build
