name: Vulnova DevSecOps Security Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly security scan at midnight UTC
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  gitleaks-secret-scan:
    name: Gitleaks Secret Detection Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks & Scan Secrets
        run: |
          echo "=== Gitleaks Secret Detection Scan ==="
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz
          ./gitleaks version
          ./gitleaks detect --verbose --redact

  semgrep-sast-scan:
    name: Semgrep SAST Code Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b92645e8574fe3e551fb26b1fbe147f87f46399 # v5.3.0
        with:
          python-version: '3.12'

      - name: Install Semgrep & Run Security Analysis
        run: |
          echo "=== Semgrep SAST Code Security Analysis ==="
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep --version
          semgrep scan --config p/default --config p/security-audit --error

  backend-dependency-audit:
    name: Backend Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b92645e8574fe3e551fb26b1fbe147f87f46399 # v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies & Run pip-audit
        run: |
          echo "=== Backend Dependency Audit (pip-audit) ==="
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit
          pip-audit --version
          pip-audit -r backend/requirements.txt

  frontend-dependency-audit:
    name: Frontend Dependency Vulnerability Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@39cd14f6864e5c82b406e5b6540c4a45b736b048 # v4.2.0
        with:
          node-version: '20'

      - name: Run npm audit
        working-directory: frontend
        run: |
          echo "=== Frontend Dependency Audit (npm audit) ==="
          npm --version
          npm audit || true

  trivy-container-security:
    name: Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Trivy & Scan Container Specs
        run: |
          echo "=== Trivy Container & IaC Security Scan ==="
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.50.1
          trivy --version
          trivy config --severity CRITICAL,HIGH --exit-code 0 .
