name: Vulnova DevSecOps Security Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly security scan at midnight UTC
    - cron: '0 0 * * *'

jobs:
  gitleaks-secret-scan:
    name: Gitleaks Secret Detection Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: zricethezav/gitleaks-action@f0088924b1a4a4608c2a8435d8869c970425313d # v8.21.2

  semgrep-sast-scan:
    name: Semgrep SAST Code Security Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep SAST Security Rules
        run: semgrep scan --config p/default --config p/security-audit --error

  backend-dependency-audit:
    name: Backend Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b92645e8574fe3e551fb26b1fbe147f87f46399 # v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies & Run pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit
          pip-audit -r backend/requirements.txt

  frontend-dependency-audit:
    name: Frontend Dependency Vulnerability Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@39cd14f6864e5c82b406e5b6540c4a45b736b048 # v4.2.0
        with:
          node-version: '20'

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=critical

  trivy-container-security:
    name: Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy Security Scanner for Repository Infrastructure Configs
        uses: aquasecurity/trivy-action@18f72960f252cf8a48b3c959d28db4e1d7168735 # v0.28.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
