apiVersion: v1
kind: ConfigMap
metadata:
  name: vulnova-config
  namespace: vulnova-prod
  labels:
    app.kubernetes.io/name: vulnova
    app.kubernetes.io/component: config
data:
  ENVIRONMENT: "production"
  DEBUG: "False"
  LOG_LEVEL: "INFO"
  DOMAIN: "vulnova.enterprise.com"
  NEXT_PUBLIC_API_URL: "https://api.vulnova.enterprise.com/api/v1"
  CORS_ALLOWED_ORIGINS: "https://vulnova.enterprise.com,https://app.vulnova.enterprise.com"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "vulnova_prod_db"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: "minio-service:9000"
  QDRANT_URL: "http://qdrant-service:6333"
  PROMETHEUS_METRICS_ENABLED: "True"
