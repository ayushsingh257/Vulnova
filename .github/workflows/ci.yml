name: Vulnova Monorepo CI Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  repository-integrity:
    name: Verify Repository Structure & Document Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Baseline Specification Documents
        run: |
          echo "Verifying baseline documentation files..."
          test -f README.md
          test -f BRAIN.md
          test -f ROADMAP.md
          test -f PROJECT_STRUCTURE.md
          test -f ARCHITECTURE.md
          test -f SECURITY.md
          test -f DATABASE.md
          test -f API_SPEC.md
          test -f FRONTEND_GUIDELINES.md
          test -f BACKEND_GUIDELINES.md
          test -f TESTING.md
          test -f DEVSECOPS.md
          test -f DEPLOYMENT.md
          test -f STYLE_GUIDE.md
          test -f TECH_STACK.md
          test -f THREAT_MODEL.md
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f DEVELOPMENT.md
          test -f docs/audits/ERA_2_COMPLETION_AUDIT.md
          test -f docs/audits/ERA_3_COMPLETION_AUDIT.md
          echo "All baseline documentation artifacts present."

      - name: Verify Disaster Recovery Infrastructure
        run: |
          echo "Verifying DR infrastructure files..."
          test -f docs/operations/DISASTER_RECOVERY.md
          test -f backend/app/infrastructure/disaster_recovery/__init__.py
          test -f backend/app/infrastructure/disaster_recovery/dto.py
          test -f backend/app/infrastructure/disaster_recovery/recovery_service.py
          test -f backend/app/infrastructure/disaster_recovery/failover_service.py
          test -f backend/app/infrastructure/disaster_recovery/rollback_service.py
          test -f backend/app/api/v1/routers/disaster_recovery.py
          test -f deployment/scripts/disaster-recovery/failover.sh
          test -f deployment/scripts/disaster-recovery/service_recovery.sh
          test -f deployment/scripts/disaster-recovery/rollback_deployment.sh
          echo "All DR infrastructure artifacts present."

      - name: Verify Incident Response Infrastructure
        run: |
          echo "Verifying Incident Response infrastructure files..."
          test -f docs/operations/INCIDENT_RESPONSE.md
          test -f backend/app/infrastructure/database/models/incident.py
          test -f backend/app/infrastructure/database/repositories/incident_repository.py
          test -f backend/app/infrastructure/incident_response/__init__.py
          test -f backend/app/infrastructure/incident_response/dto.py
          test -f backend/app/infrastructure/incident_response/incident_service.py
          test -f backend/app/infrastructure/incident_response/escalation_service.py
          test -f backend/app/infrastructure/incident_response/forensics_service.py
          test -f backend/app/infrastructure/incident_response/post_incident_service.py
          test -f backend/app/infrastructure/incident_response/escalation/__init__.py
          test -f backend/app/infrastructure/incident_response/escalation/base.py
          test -f backend/app/infrastructure/incident_response/escalation/pagerduty.py
          test -f backend/app/infrastructure/incident_response/escalation/slack.py
          test -f backend/app/infrastructure/incident_response/escalation/email.py
          test -f backend/app/api/v1/routers/incidents.py
          echo "All Incident Response infrastructure artifacts present."

      - name: Verify Security Audit Infrastructure
        run: |
          echo "Verifying Security Audit infrastructure files..."
          test -f docs/security/SECURITY_AUDIT.md
          test -f backend/app/infrastructure/security_audit/__init__.py
          test -f backend/app/infrastructure/security_audit/dto.py
          test -f backend/app/infrastructure/security_audit/audit_service.py
          test -f backend/app/infrastructure/security_audit/analyzers/__init__.py
          test -f backend/app/infrastructure/security_audit/analyzers/base.py
          test -f backend/app/infrastructure/security_audit/analyzers/sast_analyzer.py
          test -f backend/app/infrastructure/security_audit/analyzers/dependency_analyzer.py
          test -f backend/app/infrastructure/security_audit/analyzers/config_analyzer.py
          test -f backend/app/infrastructure/security_audit/analyzers/api_analyzer.py
          test -f backend/app/infrastructure/security_audit/analyzers/auth_analyzer.py
          test -f backend/app/infrastructure/security_audit/analyzers/rbac_analyzer.py
          test -f backend/app/infrastructure/security_audit/analyzers/secret_analyzer.py
          test -f backend/app/infrastructure/security_audit/analyzers/container_analyzer.py
          test -f backend/app/api/v1/routers/security_audit.py
          test -f backend/tests/test_security_audit.py
          echo "All Security Audit infrastructure artifacts present."

      - name: Verify Production Infrastructure Artifacts
        run: |
          echo "Verifying Production Deployment infrastructure files..."
          test -f docker-compose.prod.yml
          test -f .env.production.example
          test -f docs/deployment/PRODUCTION_DEPLOYMENT.md
          test -f deployment/kubernetes/namespace.yaml
          test -f deployment/kubernetes/configmap.yaml
          test -f deployment/kubernetes/secrets.yaml.example
          test -f deployment/kubernetes/backend/deployment.yaml
          test -f deployment/kubernetes/backend/service.yaml
          test -f deployment/kubernetes/backend/hpa.yaml
          test -f deployment/kubernetes/frontend/deployment.yaml
          test -f deployment/kubernetes/frontend/service.yaml
          test -f deployment/kubernetes/frontend/hpa.yaml
          test -f deployment/kubernetes/postgres/statefulset.yaml
          test -f deployment/kubernetes/postgres/service.yaml
          test -f deployment/kubernetes/redis/deployment.yaml
          test -f deployment/kubernetes/redis/service.yaml
          test -f deployment/kubernetes/ingress/ingress.yaml
          echo "All Production Deployment infrastructure artifacts present."

  docker-validation:
    name: Docker & Kubernetes Infrastructure Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Development Docker Compose Configuration Syntax
        run: docker compose config

      - name: Validate Production Docker Compose Configuration Syntax
        run: docker compose -f docker-compose.prod.yml config

      - name: Validate Kubernetes Manifests Syntax (PyYAML)
        run: python3 -c "import glob, yaml; [yaml.safe_load(open(f)) for f in glob.glob('deployment/kubernetes/**/*.yaml', recursive=True)] and print('Kubernetes YAML manifests validated!')"

  backend-checks:
    name: Backend Lint, Black, Mypy & Pytest Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies from Authoritative requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Black Formatter Check
        run: black --check backend/app

      - name: Run Ruff Linter
        run: ruff check backend/app

      - name: Run Mypy Type Checker
        working-directory: backend
        env:
          PYTHONPATH: .
        run: mypy app --ignore-missing-imports

      - name: Run Pytest Suite
        working-directory: backend
        run: pytest

  frontend-checks:
    name: Frontend Lint, Type-Check & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Verify TypeScript Types
        working-directory: frontend
        run: npm run type-check

      - name: Build Next.js Application
        working-directory: frontend
        run: npm run build
