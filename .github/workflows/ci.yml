name: Vulnova Monorepo CI Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  repository-integrity:
    name: Verify Repository Structure & Document Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Baseline Specification Documents
        run: |
          echo "Verifying baseline documentation files..."
          test -f README.md
          test -f BRAIN.md
          test -f ROADMAP.md
          test -f PROJECT_STRUCTURE.md
          test -f ARCHITECTURE.md
          test -f SECURITY.md
          test -f DATABASE.md
          test -f API_SPEC.md
          test -f FRONTEND_GUIDELINES.md
          test -f BACKEND_GUIDELINES.md
          test -f TESTING.md
          test -f DEVSECOPS.md
          test -f DEPLOYMENT.md
          test -f STYLE_GUIDE.md
          test -f TECH_STACK.md
          test -f THREAT_MODEL.md
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f DEVELOPMENT.md
          test -f docs/audits/ERA_2_COMPLETION_AUDIT.md
          test -f docs/audits/ERA_3_COMPLETION_AUDIT.md
          echo "All baseline documentation artifacts present."

  docker-validation:
    name: Docker Infrastructure Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Docker Compose Configuration Syntax
        run: docker compose config

  backend-checks:
    name: Backend Lint, Black, Mypy & Pytest Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies from Authoritative requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Black Formatter Check
        run: black --check backend/app

      - name: Run Ruff Linter
        run: ruff check backend/app

      - name: Run Mypy Type Checker
        working-directory: backend
        env:
          PYTHONPATH: .
        run: mypy app --ignore-missing-imports

      - name: Run Pytest Suite
        working-directory: backend
        run: pytest

  frontend-checks:
    name: Frontend Lint, Type-Check & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Verify TypeScript Types
        working-directory: frontend
        run: npm run type-check

      - name: Build Next.js Application
        working-directory: frontend
        run: npm run build
