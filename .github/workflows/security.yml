name: Vulnova DevSecOps Security Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly security scan at midnight UTC
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  gitleaks-secret-scan:
    name: Gitleaks Secret Detection Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks & Scan Secrets
        run: |
          echo "=== Gitleaks Secret Detection Scan ==="
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.21.2_linux_x64.tar.gz
          ./gitleaks version
          ./gitleaks detect --verbose --redact

  semgrep-sast-scan:
    name: Semgrep SAST Code Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: Install Semgrep & Run Security Analysis
        run: |
          echo "=== Semgrep SAST Code Security Analysis ==="
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep --version
          semgrep scan --config p/default --config p/security-audit || true

  backend-dependency-audit:
    name: Backend Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies & Run pip-audit
        run: |
          echo "=== Backend Dependency Audit (pip-audit) ==="
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit
          pip-audit --version
          pip-audit -r backend/requirements.txt

  frontend-dependency-audit:
    name: Frontend Dependency Vulnerability Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 20
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'

      - name: Run npm audit
        working-directory: frontend
        run: |
          echo "=== Frontend Dependency Audit (npm audit) ==="
          npm --version
          npm audit || true

  trivy-container-security:
    name: Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Trivy & Scan Container Specs
        run: |
          echo "=== Trivy Container & IaC Security Scan ==="
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version
          trivy config --severity CRITICAL,HIGH --exit-code 0 .
